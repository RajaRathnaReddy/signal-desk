services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://signaldesk:secretpassword@postgres:5432/signaldesk?schema=public
      - SITE_URL=http://localhost:3000
      - APP_SECRET=replace-with-a-very-long-secret-key-32-chars
      - ADMIN_EMAIL=editor@example.com
      - ADMIN_PASSWORD=ChangeMeOnFirstLogin2026!
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=signaldesk
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=signaldesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signaldesk -d signaldesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
