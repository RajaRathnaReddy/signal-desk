<svg xmlns="http://www.w3.org/2005/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="fast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="think" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="400" y="45" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Hybrid Reasoning Architecture</text>
  <text x="400" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Dual-mode execution: instantaneous standard inference vs extended test-time thinking</text>

  <!-- Input Prompt -->
  <rect x="50" y="160" width="150" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="125" y="210" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="600">Prompt Input</text>
  <text x="125" y="235" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="12">User instructions &amp; code</text>

  <!-- Router -->
  <polygon points="260,220 310,170 360,220 310,270" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="310" y="224" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700">ROUTER</text>

  <!-- Branch Fast -->
  <rect x="440" y="120" width="280" height="75" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5"/>
  <text x="455" y="150" fill="#f0f9ff" font-family="system-ui" font-size="14" font-weight="600">Mode A: Instant Response</text>
  <text x="455" y="172" fill="#bae6fd" font-family="system-ui" font-size="12">Direct generation · standard latency &amp; token budget</text>

  <!-- Branch Thinking -->
  <rect x="440" y="240" width="280" height="85" rx="8" fill="#451a03" stroke="#d97706" stroke-width="1.5"/>
  <text x="455" y="270" fill="#fef3c7" font-family="system-ui" font-size="14" font-weight="600">Mode B: Extended Test-Time Compute</text>
  <text x="455" y="292" fill="#fde68a" font-family="system-ui" font-size="12">Hidden reasoning traces · self-verification loop</text>
  <text x="455" y="310" fill="#fde68a" font-family="system-ui" font-size="11">Multi-step mathematical &amp; code proofing</text>

  <!-- Connector Lines -->
  <path d="M 200 220 L 260 220" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 360 220 L 400 220 L 400 155 L 440 155" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 360 220 L 400 220 L 400 280 L 440 280" stroke="#fbbf24" stroke-width="2" fill="none"/>

  <rect x="50" y="380" width="700" height="40" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="400" y="405" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="12">Signal Desk Architecture Schematic · Frontier AI Reasoning Systems</text>
</svg>
