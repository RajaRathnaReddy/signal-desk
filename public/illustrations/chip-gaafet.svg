<svg xmlns="http://www.w3.org/2005/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="400" y="45" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">GAAFET Nanosheet Transistor Evolution</text>
  <text x="400" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Transition from FinFET to Gate-All-Around Nanosheets for sub-3nm scaling</text>

  <!-- Left: FinFET -->
  <g transform="translate(100, 110)">
    <rect width="260" height="240" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="130" y="30" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="14" font-weight="600">FinFET (3-sided Gate)</text>
    <rect x="60" y="160" width="140" height="40" fill="#334155" rx="4"/>
    <text x="130" y="185" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Substrate</text>
    <!-- Fin -->
    <rect x="115" y="80" width="30" height="80" fill="#0284c7" rx="2"/>
    <!-- Gate covering 3 sides -->
    <path d="M 85 80 L 115 80 L 115 150 L 145 150 L 145 80 L 175 80 L 175 60 L 85 60 Z" fill="#64748b" opacity="0.7"/>
    <text x="130" y="225" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="11">Limited electrostatic control at &lt;3nm</text>
  </g>

  <!-- Right: GAAFET -->
  <g transform="translate(440, 110)">
    <rect width="260" height="240" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="130" y="30" text-anchor="middle" fill="#34d399" font-family="system-ui" font-size="14" font-weight="600">GAAFET (4-sided Nanosheets)</text>
    <rect x="60" y="160" width="140" height="40" fill="#334155" rx="4"/>
    <text x="130" y="185" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Substrate</text>
    <!-- 3 Stacked Horizontal Nanosheets -->
    <rect x="90" y="70" width="80" height="14" rx="2" fill="#38bdf8"/>
    <rect x="90" y="95" width="80" height="14" rx="2" fill="#38bdf8"/>
    <rect x="90" y="120" width="80" height="14" rx="2" fill="#38bdf8"/>
    <!-- Surrounding Gate -->
    <rect x="75" y="60" width="110" height="90" fill="none" stroke="#10b981" stroke-dasharray="4 2" stroke-width="1.5"/>
    <text x="130" y="225" text-anchor="middle" fill="#34d399" font-family="system-ui" font-size="11">Complete 360° gate control · reduced leakage</text>
  </g>

  <rect x="50" y="380" width="700" height="40" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="400" y="405" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="12">Signal Desk Semiconductor Engineering Analysis · 2nm Process Nodes</text>
</svg>
