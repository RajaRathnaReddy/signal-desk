<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">A host application connected to MCP servers</title>
  <desc id="d">An AI application contains a model and several MCP clients. Each client connects to a separate MCP server that exposes a service, local files, or a database.</desc>
  <rect width="1200" height="675" fill="#f3efe7"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#16161a">
    <text x="60" y="80" font-size="22" letter-spacing="3" fill="#8a8478">DIAGRAM · MODEL CONTEXT PROTOCOL</text>
    <rect x="60" y="140" width="460" height="420" rx="4" fill="none" stroke="#16161a" stroke-width="2"/>
    <text x="90" y="182" font-size="18" fill="#5d5a52" letter-spacing="2">HOST APPLICATION</text>
    <rect x="90" y="215" width="400" height="90" rx="4" fill="#16161a"/>
    <text x="290" y="268" font-size="26" text-anchor="middle" font-weight="600" fill="#f3efe7">Language model</text>
    <g stroke="#16161a" stroke-width="2" fill="none">
      <rect x="90" y="345" width="400" height="48" rx="4"/><rect x="90" y="405" width="400" height="48" rx="4"/><rect x="90" y="465" width="400" height="48" rx="4"/>
    </g>
    <g font-size="20" text-anchor="middle" font-weight="600"><text x="290" y="377">MCP client A</text><text x="290" y="437">MCP client B</text><text x="290" y="497">MCP client C</text></g>
    <path d="M290 307 V343" stroke="#16161a" stroke-width="2"/>
    <g stroke="#d9402a" stroke-width="3" fill="none"><path d="M492 369 H690" marker-end="url(#r)"/><path d="M492 429 H690" marker-end="url(#r)"/><path d="M492 489 H690" marker-end="url(#r)"/></g>
    <text x="590" y="354" font-size="15" text-anchor="middle" fill="#d9402a">JSON-RPC</text>
    <g fill="#d9402a"><rect x="694" y="190" width="446" height="100" rx="4" opacity="0"/></g>
    <g stroke="#16161a" stroke-width="2" fill="none">
      <rect x="694" y="335" width="446" height="68" rx="4"/><rect x="694" y="415" width="446" height="68" rx="4"/><rect x="694" y="495" width="446" height="68" rx="4"/>
    </g>
    <g font-size="22" font-weight="600"><text x="720" y="364">MCP server</text><text x="720" y="444">MCP server</text><text x="720" y="524">MCP server</text></g>
    <g font-size="17" fill="#5d5a52"><text x="720" y="389">issue tracker (remote, over HTTP)</text><text x="720" y="469">local files (on this machine)</text><text x="720" y="549">database (queries)</text></g>
    <text x="694" y="300" font-size="18" fill="#5d5a52" letter-spacing="2">SERVERS OFFER TOOLS · RESOURCES · PROMPTS</text>
    <text x="60" y="620" font-size="18" fill="#5d5a52">Each server runs with its own permissions. Treat installing one like installing software.</text>
  </g>
  <defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d9402a"/></marker></defs>
</svg>
