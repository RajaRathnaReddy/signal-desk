<svg xmlns="http://www.w3.org/2005/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091322"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="400" y="45" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Kubernetes Dynamic Resource Allocation (DRA)</text>
  <text x="400" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Structured scheduling and slicing for heterogeneous AI GPUs, NPUs, and FPGAs</text>

  <!-- Pod Spec -->
  <g transform="translate(60, 120)">
    <rect width="180" height="200" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="35" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="14" font-weight="600">Workload Pod</text>
    <rect x="20" y="55" width="140" height="45" rx="4" fill="#0f172a"/>
    <text x="30" y="75" fill="#e2e8f0" font-family="system-ui" font-size="11">ResourceClaim</text>
    <text x="30" y="90" fill="#94a3b8" font-family="system-ui" font-size="10">Class: ai-gpu-cluster</text>
    <rect x="20" y="115" width="140" height="65" rx="4" fill="#0f172a"/>
    <text x="30" y="135" fill="#e2e8f0" font-family="system-ui" font-size="11">Constraints</text>
    <text x="30" y="152" fill="#94a3b8" font-family="system-ui" font-size="10">minMem: 80GB</text>
    <text x="30" y="168" fill="#94a3b8" font-family="system-ui" font-size="10">interconnect: NVLink</text>
  </g>

  <!-- DRA Controller -->
  <g transform="translate(310, 150)">
    <rect width="180" height="140" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="90" y="35" text-anchor="middle" fill="#818cf8" font-family="system-ui" font-size="14" font-weight="600">DRA Driver</text>
    <text x="90" y="65" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="11">Vendor Plugin</text>
    <text x="90" y="90" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Topology Aware</text>
    <text x="90" y="115" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Fine-grained partitioning</text>
  </g>

  <!-- Physical Accelerators -->
  <g transform="translate(560, 120)">
    <rect width="180" height="200" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="35" text-anchor="middle" fill="#34d399" font-family="system-ui" font-size="14" font-weight="600">Accelerator Pool</text>
    <rect x="20" y="55" width="140" height="35" rx="4" fill="#064e3b"/>
    <text x="90" y="78" text-anchor="middle" fill="#a7f3d0" font-family="system-ui" font-size="11">GPU 0 · Partition 40GB</text>
    <rect x="20" y="100" width="140" height="35" rx="4" fill="#064e3b"/>
    <text x="90" y="123" text-anchor="middle" fill="#a7f3d0" font-family="system-ui" font-size="11">GPU 1 · Partition 40GB</text>
    <rect x="20" y="145" width="140" height="35" rx="4" fill="#064e3b"/>
    <text x="90" y="168" text-anchor="middle" fill="#a7f3d0" font-family="system-ui" font-size="11">RDMA Fabric Bond</text>
  </g>

  <path d="M 240 220 L 310 220" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 490 220 L 560 220" stroke="#34d399" stroke-width="2"/>

  <rect x="50" y="380" width="700" height="40" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="400" y="405" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="12">Signal Desk Cloud Infrastructure Systems · Container Orchestration</text>
</svg>
