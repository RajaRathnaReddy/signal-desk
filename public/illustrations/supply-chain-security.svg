<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="400" y="45" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Software Supply Chain Security &amp; Attestation</text>
  <text x="400" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">End-to-end cryptographic verification from source commit to production deployment</text>

  <!-- Step 1 -->
  <g transform="translate(60, 130)">
    <rect width="140" height="150" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="70" y="35" text-anchor="middle" fill="#93c5fd" font-family="system-ui" font-size="13" font-weight="600">1. Source</text>
    <text x="70" y="65" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Signed Commits</text>
    <text x="70" y="85" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">2FA Reviewers</text>
    <text x="70" y="115" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="10">Branch Protection</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(250, 130)">
    <rect width="140" height="150" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="70" y="35" text-anchor="middle" fill="#c4b5fd" font-family="system-ui" font-size="13" font-weight="600">2. Hermetic Build</text>
    <text x="70" y="65" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Isolated Runner</text>
    <text x="70" y="85" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Pinned Deps</text>
    <text x="70" y="115" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="10">SLSA Level 3</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(440, 130)">
    <rect width="140" height="150" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="70" y="35" text-anchor="middle" fill="#6ee7b7" font-family="system-ui" font-size="13" font-weight="600">3. Provenance</text>
    <text x="70" y="65" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Sigstore Cosign</text>
    <text x="70" y="85" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">SBOM Generation</text>
    <text x="70" y="115" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="10">CycloneDX / SPDX</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(630, 130)">
    <rect width="120" height="150" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="60" y="35" text-anchor="middle" fill="#fcd34d" font-family="system-ui" font-size="13" font-weight="600">4. Gate</text>
    <text x="60" y="65" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Policy Controller</text>
    <text x="60" y="85" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Reject Unsigned</text>
    <text x="60" y="115" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="10">K8s Admission</text>
  </g>

  <!-- Arrows -->
  <path d="M 200 205 L 250 205" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 390 205 L 440 205" stroke="#a78bfa" stroke-width="2"/>
  <path d="M 580 205 L 630 205" stroke="#34d399" stroke-width="2"/>

  <rect x="50" y="380" width="700" height="40" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="400" y="405" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="12">Signal Desk Cybersecurity Reference Architecture · Software Supply Chain Defense</text>
</svg>
